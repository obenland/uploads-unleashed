name: E2E Tests

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30

        env:
            WP_E2E_DIR: /tmp/wordpress-e2e

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The runner image ships MySQL (root/root); starting it beats pulling a service container.
            - name: Start MySQL
              run: sudo systemctl start mysql.service

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: '8.4'
                  extensions: curl, dom, gd, mbstring, mysqli, zip
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'

            - name: Cache npm downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install Node dependencies
              run: npm ci --prefer-offline --no-audit --no-fund

            - name: Build assets
              run: npm run build

            - name: Resolve Playwright version
              id: playwright
              run: |
                  echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
                  echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

            # The runner image ships Chrome's system libraries; keying on the image reinstalls them on a new one.
            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npm run test:e2e:install

            - name: Resolve latest WordPress version
              id: wp
              run: echo "version=$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')" >> "$GITHUB_OUTPUT"

            - name: Restore WordPress
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: wp-cache
              with:
                  path: |
                      ${{ env.WP_E2E_DIR }}
                      !${{ env.WP_E2E_DIR }}/server.*
                      !${{ env.WP_E2E_DIR }}/wp-content/debug.log
                  key: wp-e2e-${{ steps.wp.outputs.version }}-${{ hashFiles('bin/start-e2e-wordpress.sh') }}

            - name: Start WordPress
              run: bin/start-e2e-wordpress.sh root root 127.0.0.1 "$WP_VERSION"
              env:
                  WP_VERSION: ${{ steps.wp.outputs.version }}

            # Saved before the tests run, so test uploads don't end up in the cache.
            - name: Save WordPress
              if: steps.wp-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ${{ env.WP_E2E_DIR }}
                      !${{ env.WP_E2E_DIR }}/server.*
                      !${{ env.WP_E2E_DIR }}/wp-content/debug.log
                  key: ${{ steps.wp-cache.outputs.cache-primary-key }}

            - name: Run Playwright tests
              run: npm run test:e2e

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14

            # Its own artifact, so the report stays at the root of its artifact.
            - name: Upload server logs on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: wordpress-logs
                  path: |
                      ${{ env.WP_E2E_DIR }}/server.log
                      ${{ env.WP_E2E_DIR }}/wp-content/debug.log
                  retention-days: 14
