name: E2E Tests

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30

        env:
            WP_E2E_DIR: /tmp/wordpress-e2e

        steps:
            - uses: actions/checkout@v7

            # The runner image ships MySQL (root/root); starting it beats pulling a service container.
            - name: Start MySQL
              run: sudo systemctl start mysql.service

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: curl, dom, gd, mbstring, mysqli, zip
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'

            - name: Cache npm downloads
              uses: actions/cache@v6
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install Node dependencies
              run: npm ci --prefer-offline --no-audit --no-fund

            - name: Build assets
              run: npm run build

            - name: Resolve Playwright version
              id: playwright
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Cache Playwright browsers
              uses: actions/cache@v6
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

            # The runner image ships Chrome, so its system libraries are only installed alongside a fresh download.
            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npm run test:e2e:install

            - name: Start WordPress
              run: bin/start-e2e-wordpress.sh root root 127.0.0.1

            - name: Run Playwright tests
              run: npm run test:e2e

            - name: Upload Playwright report and server logs on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      ${{ env.WP_E2E_DIR }}/server.log
                      ${{ env.WP_E2E_DIR }}/wp-content/debug.log
                  retention-days: 14
