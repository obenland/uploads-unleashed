name: PHP Tests

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]

permissions:
    contents: read

jobs:
    test:
        # The plain PHP legs keep their `test (<php>)` names, which are required checks.
        name: test (${{ matrix.php }}${{ matrix.label && format(', {0}', matrix.label) || '' }})
        runs-on: ubuntu-latest
        # Only the nightly leg may fail: it flags upcoming core changes without blocking PRs.
        continue-on-error: ${{ matrix.wp == 'nightly' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '7.4'
                    - php: '8.1'
                    - php: '8.4'
                    - php: '8.4'
                      multisite: true
                      label: multisite
                    # `Requires at least: 6.4`: the newest 6.4.x release on the oldest PHP.
                    - php: '7.4'
                      wp: '6.4'
                      label: WP 6.4
                    - php: '8.4'
                      wp: nightly
                      label: WP nightly

        env:
            WP_CORE_DIR: /tmp/wordpress
            WP_TESTS_DIR: /tmp/wordpress-tests-lib

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The runner image ships MySQL (root/root); starting it beats pulling a service container.
            - name: Start MySQL
              run: sudo systemctl start mysql.service

            - name: Setup PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, mysqli, zip
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: composer-cache
              with:
                  path: vendor
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

            - name: Install PHP dependencies
              if: steps.composer-cache.outputs.cache-hit != 'true'
              run: composer install --prefer-dist --no-progress

            # The plugin requires build/*.asset.php on init, so tests need built assets.
            - name: Cache built assets
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: build-cache
              with:
                  path: build
                  key: build-${{ hashFiles('src/**', 'package.json', 'package-lock.json', 'webpack.config.js', '.nvmrc') }}

            - name: Setup Node.js
              if: steps.build-cache.outputs.cache-hit != 'true'
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'

            - name: Cache npm downloads
              if: steps.build-cache.outputs.cache-hit != 'true'
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Build assets
              if: steps.build-cache.outputs.cache-hit != 'true'
              run: |
                  npm ci --prefer-offline --no-audit --no-fund
                  npm run build

            - name: Resolve WordPress version
              id: wp
              run: |
                  version=$(bin/resolve-wp-version.sh "$WP_VERSION")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
              env:
                  WP_VERSION: ${{ matrix.wp || 'latest' }}

            # The nightly build changes daily, so it isn't cached.
            - name: Restore WordPress and test library
              if: steps.wp.outputs.version != 'nightly'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: wp-cache
              with:
                  path: |
                      ${{ env.WP_CORE_DIR }}
                      ${{ env.WP_TESTS_DIR }}
                  key: wp-${{ steps.wp.outputs.version }}-${{ hashFiles('bin/install-wp-tests.sh', 'bin/resolve-wp-version.sh') }}

            - name: Install WordPress test environment
              run: bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 "$WP_VERSION"
              env:
                  WP_VERSION: ${{ steps.wp.outputs.version }}

            # Saved before the tests run, so test uploads don't end up in the cache.
            - name: Save WordPress and test library
              if: steps.wp.outputs.version != 'nightly' && steps.wp-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ${{ env.WP_CORE_DIR }}
                      ${{ env.WP_TESTS_DIR }}
                  key: ${{ steps.wp-cache.outputs.cache-primary-key }}

            - name: Run PHPUnit tests
              run: vendor/bin/phpunit
              env:
                  WP_MULTISITE: ${{ matrix.multisite && '1' || '0' }}
