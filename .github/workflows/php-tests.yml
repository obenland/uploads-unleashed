name: PHP Tests

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['7.4', '8.4']

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache Docker images
              uses: actions/cache@v6
              id: docker-cache
              with:
                  path: /tmp/docker-images.tar
                  key: docker-${{ matrix.php }}-${{ hashFiles('.wp-env.tests.json') }}

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip
                  coverage: none

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Cache Composer dependencies
              uses: actions/cache@v6
              id: composer-cache
              with:
                  path: vendor
                  key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

            - name: Install PHP dependencies
              if: steps.composer-cache.outputs.cache-hit != 'true'
              run: composer install --prefer-dist --no-progress

            - name: Cache node_modules
              uses: actions/cache@v6
              id: node-modules-cache
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install Node dependencies
              if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - name: Build assets
              run: npm run build

            - name: Load Docker images
              if: steps.docker-cache.outputs.cache-hit == 'true'
              run: docker load -i /tmp/docker-images.tar

            - name: Start WordPress environment
              run: npm run start:tests
              env:
                  WP_ENV_PHP_VERSION: ${{ matrix.php }}

            - name: Save Docker images
              if: steps.docker-cache.outputs.cache-hit != 'true'
              run: docker save -o /tmp/docker-images.tar $(docker image list --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')

            - name: Run PHPUnit tests
              run: npm test
