name: Dependabot auto-merge
on: pull_request

permissions: {}

jobs:
    dependabot:
        # Author and sender must both be Dependabot, so human pushes to its branches don't qualify.
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.sender.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        # Needed when it falls back to GITHUB_TOKEN.
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Enable auto-merge
              # A PAT-merged push triggers trunk workflows (and their caches); GITHUB_TOKEN pushes don't.
              run: |
                  if [ -n "$WORKFLOW_PAT" ] && GH_TOKEN="$WORKFLOW_PAT" gh pr merge --auto --squash "$PR_URL"; then
                      exit 0
                  fi
                  if [ -n "$WORKFLOW_PAT" ]; then
                      echo "::warning::WORKFLOW_PAT was rejected; falling back to GITHUB_TOKEN, so the merge won't trigger trunk workflows. Update the Dependabot secret."
                  fi
                  GH_TOKEN="$GITHUB_TOKEN" gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
