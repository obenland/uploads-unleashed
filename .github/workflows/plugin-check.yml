name: Plugin Check

on:
    push:
        branches: [trunk]
    pull_request:
        branches: [trunk]
    # Lets release.yml gate the deploy on it.
    workflow_call:

permissions:
    contents: read

jobs:
    plugin-check:
        name: Plugin Check
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  # Release runs reuse this job, so never restore caches that PR runs can write.
                  package-manager-cache: false

            - name: Install Node dependencies
              run: npm ci --no-audit --no-fund

            - name: Build assets
              run: npm run build

            # The same files the deploy ships: everything but what .distignore excludes.
            - name: Build plugin
              run: rsync -rc --exclude-from=.distignore ./ "$RUNNER_TEMP/uploads-unleashed/"

            - name: Run Plugin Check
              uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
              with:
                  build-dir: ${{ runner.temp }}/uploads-unleashed
