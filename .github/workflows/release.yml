name: Release and Deploy

on:
    push:
        tags:
            - '[0-9]*.[0-9]*.[0-9]*'

permissions:
    contents: write
    pull-requests: read

jobs:
    deploy:
        name: Release and deploy to WordPress.org
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Update version strings
              run: |
                  git checkout trunk
                  sed -i "s/\* Version: .*/* Version: ${{ github.ref_name }}/" uploads-unleashed.php
                  sed -i "s/UPLOADS_UNLEASHED_VERSION', '[^']*'/UPLOADS_UNLEASHED_VERSION', '${{ github.ref_name }}'/" uploads-unleashed.php
                  sed -i "s/Stable tag: .*/Stable tag: ${{ github.ref_name }}/" readme.txt
                  sed -i 's/"version": "[^"]*"/"version": "${{ github.ref_name }}"/' package.json
                  sed -i '/"name": "uploads-unleashed"/{n;s/"version": "[^"]*"/"version": "${{ github.ref_name }}"/}' package-lock.json

            - name: Push version bump to trunk
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              run: |
                  TRUNK_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/trunk --jq '.object.sha')

                  create_blob() {
                      gh api repos/${{ github.repository }}/git/blobs \
                          --field encoding=base64 \
                          --field content="$(base64 -w0 "$1")" \
                          --jq '.sha'
                  }

                  TREE_ITEMS="[]"
                  for FILE in uploads-unleashed.php readme.txt package.json package-lock.json; do
                      BLOB_SHA=$(create_blob "$FILE")
                      TREE_ITEMS=$(echo "$TREE_ITEMS" | jq --arg path "$FILE" --arg sha "$BLOB_SHA" \
                          '. + [{"path": $path, "mode": "100644", "type": "blob", "sha": $sha}]')
                  done

                  TREE_SHA=$(gh api repos/${{ github.repository }}/git/trees \
                      --field base_tree="$TRUNK_SHA" \
                      --raw-field tree="$TREE_ITEMS" \
                      --jq '.sha')

                  COMMIT_SHA=$(gh api repos/${{ github.repository }}/git/commits \
                      --field message="Bump version to ${{ github.ref_name }} [skip ci]" \
                      --field tree="$TREE_SHA" \
                      --raw-field "parents=[\"$TRUNK_SHA\"]" \
                      --field "author[name]=Konstantin Obenland" \
                      --field "author[email]=obenland@gmx.de" \
                      --jq '.sha')

                  gh api repos/${{ github.repository }}/git/refs/heads/trunk \
                      --method PATCH \
                      --field sha="$COMMIT_SHA"

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Cache node_modules
              uses: actions/cache@v4
              id: node-modules-cache
              with:
                  path: node_modules
                  key: node-modules-${{ hashFiles('package-lock.json') }}

            - if: steps.node-modules-cache.outputs.cache-hit != 'true'
              run: npm ci

            - run: npm run build

            - if: false # TEST: skip deploy
              name: Deploy to WordPress.org
              id: deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              with:
                  generate-zip: true
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

            - if: false # TEST: skip changelog
              name: Build changelog
              id: changelog
              uses: mikepenz/release-changelog-builder-action@v6
              with:
                  configuration: '.github/changelog_configuration.json'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - if: false # TEST: skip release
              name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  body: ${{ steps.changelog.outputs.changelog }}
                  files: ${{ steps.deploy.outputs.zip-path }}
