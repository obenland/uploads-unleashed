name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create release zip
        run: |
          # Create archive using git archive (respects .gitattributes export-ignore)
          git archive --format=zip --prefix=uploads-unleashed/ HEAD > uploads-unleashed.zip

          # Add build/ directory (not in git, but needed for distribution)
          mkdir -p uploads-unleashed
          cp -r build/ uploads-unleashed/
          zip -r uploads-unleashed.zip uploads-unleashed/build/

          # Clean up temp directory
          rm -rf uploads-unleashed

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: uploads-unleashed.zip
